changelog:
  categories:
    - title: 🚀 Features
      labels:
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: 🚀 Dependency Updates
      labels:
        - dependencies
    - title: 📘 Documentation Updates
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*" # Catch-all for pull requests that didn't match any of the previous categories
